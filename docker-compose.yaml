version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: firstcode-db
      POSTGRES_USER: firstcode-user
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - django_network
    

  web:
    build: .
    command: ["sh", "-c", "python manage.py makemigrations && python manage.py migrate && python manage.py migrate --run-syncdb && python manage.py runserver 0.0.0.0:8000"]
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=FirstCode_DRF_Backend.settings


    depends_on:
      - db
    networks:
      - django_network
    restart: on-failure

networks:
  django_network:
    driver: bridge

volumes:
  postgres_data:
