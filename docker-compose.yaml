version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: firstcode
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - django_network

  web:
    image: django-server
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - django_network

networks:
  django_network:
    driver: bridge

volumes:
  postgres_data:
