name: Deployment of Firstcode API Django Application 

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Contabo VPS
        run: |
          ssh -o StrictHostKeyChecking=no deployer@194.163.178.118<< 'EOF'
          cd /home/deployer/workspace/FC_DRF_BE/FirstCode_DRF_Backend
          git pull origin main
          docker build -t fc_api .
          docker restart fc_api_server
          EOF